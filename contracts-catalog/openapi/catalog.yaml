openapi: 3.1.0
info:
  title: Hubinity Catalog API
  version: 0.1.0
  description: |
    Contract for the Catalog domain. Owns products, categories, and on-hand stock.
    Backend services consume the generated DTOs from this module.

    Product image storage — URL-only reference strategy: product images are
    hosted outside this system. The catalog persists only absolute URLs and
    never receives, stores, or serves image bytes; there is no upload,
    download, or transformation operation, and no per-image resource URI.
    HTTPS URLs are expected — an http:// URL will be blocked as mixed content
    by browsers rendering the catalog over HTTPS. Availability and lifecycle
    of the referenced file belong to the external host: the catalog does not
    verify that a URL resolves, and a reference that stops resolving is not a
    contract violation. Removing an image removes the reference, never a
    stored file.
  contact:
    name: Hubinity Platform
    email: platform@hubinity.local
servers:
  - url: https://api.hubinity.local
    description: Production-like default; overridden per environment
security:
  - bearerAuth: []
tags:
  - name: products
    description: Product catalog
  - name: stock
    description: Product stock balance and movements
paths:
  /api/v1/products/{id}:
    get:
      tags: [products]
      operationId: getProductById
      summary: Fetch a product by its identifier
      parameters:
        - name: id
          in: path
          required: true
          description: Product UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
  /api/v1/products/{productId}/stock:
    summary: Stock balance for a product (canonical path)
    description: |
      Canonical read address for a product's on-hand stock snapshot.
      The GET operation, its productId parameter, the response body, and
      the authorization requirement are fully declared (T-001 chain
      complete). Access requires a valid Bearer JWT (see the bearerAuth
      security scheme); no admin role is required for reads.
    get:
      tags: [stock]
      operationId: getStockItemByProductId
      summary: Fetch the current stock balance for a product
      parameters:
        - name: productId
          in: path
          required: true
          description: Product UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current stock balance for the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '404':
          description: Stock balance not found for the given product (unknown product or no stock record)
  /api/v1/products/{productId}/images:
    summary: Image references for a product
    description: |
      Address for managing a product's image references. The POST operation,
      its request body, its response body, and the authorization requirement
      are fully declared (T-002 chain complete). Images follow the URL-only
      reference strategy declared at the document level: this API records only
      their URLs and never receives image bytes. Access requires a valid
      Bearer JWT (inherited from the document-level bearerAuth security
      scheme); registering an image additionally requires the admin role.
    parameters:
      - name: productId
        in: path
        required: true
        description: Product UUID
        schema:
          type: string
          format: uuid
    post:
      tags: [products]
      operationId: addProductImage
      summary: Register an image reference for a product
      description: |
        Records the URL of an externally hosted image against the product.
        No image bytes are transmitted. Requires the admin realm role — a
        valid Bearer JWT alone is not sufficient; requests authenticated
        without that role are rejected with 403.
      requestBody:
        required: true
        description: The image reference to register
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
      responses:
        '201':
          description: |
            Image reference registered. No Location header is returned:
            under the URL-only strategy there is no per-image resource URI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImageResponse'
        '400':
          description: Malformed request body, or url absent, not a valid URI, or too long
        '403':
          description: Authenticated principal lacks the required admin role
        '404':
          description: Product not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT (realm hibit) presented as a Bearer token.
  schemas:
    Product:
      type: object
      description: A sellable item in the catalog.
      required:
        - id
        - sku
        - name
        - price
        - categoryId
        - active
      properties:
        id:
          type: string
          format: uuid
          description: Product unique identifier
        sku:
          type: string
          description: Stock-keeping unit, unique per tenant
          minLength: 1
          maxLength: 64
        name:
          type: string
          description: Human-readable product name
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Optional long-form description
        price:
          type: number
          format: double
          description: Current sale price in the tenant's default currency
          minimum: 0
        categoryId:
          type: string
          format: uuid
          description: Identifier of the owning category
        active:
          type: boolean
          description: Whether the product is currently sellable
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        images:
          type: array
          description: |
            Absolute URLs of the product's images, in order — the first
            element is the primary image. Absent or empty when the product
            has no image registered. Images are hosted externally; see the
            URL-only reference strategy declared at the document level.
          items:
            type: string
            format: uri
            maxLength: 2048
    Category:
      type: object
      description: A hierarchical grouping of products.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        parentId:
          type: string
          format: uuid
          description: Optional parent category for hierarchies
        active:
          type: boolean
          default: true
    StockItem:
      type: object
      description: Current stock balance snapshot for a product.
      required:
        - productId
        - available
        - reserved
        - reorderPoint
      properties:
        productId:
          type: string
          format: uuid
          description: Product unique identifier
        available:
          type: integer
          format: int32
          minimum: 0
          description: Units available for sale or reservation
        reserved:
          type: integer
          format: int32
          minimum: 0
          description: Units held by active reservations
        reorderPoint:
          type: integer
          format: int32
          minimum: 0
          description: Threshold that signals restocking
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last counter change
    StockMovement:
      type: object
      description: |
        A discrete change in stock (inbound, outbound, adjustment). Drives the
        StockChanged event downstream.
      required:
        - id
        - productId
        - quantityDelta
        - reason
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantityDelta:
          type: integer
          format: int64
          description: Positive for inbound, negative for outbound
        reason:
          type: string
          enum: [PURCHASE, SALE, ADJUSTMENT, RETURN, LOSS]
        note:
          type: string
        occurredAt:
          type: string
          format: date-time
    ProductImageRequest:
      type: object
      description: |
        A reference to an image hosted outside this system. The catalog
        stores only the URL; image bytes are never transmitted. HTTPS URLs
        are expected — an http:// URL will be blocked as mixed content by
        browsers rendering the catalog over HTTPS.
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: Absolute URL of the externally hosted image
    ProductImageResponse:
      type: object
      description: |
        The product's image references after the registration. Returns the
        full resulting collection, not just the newly added entry, so the
        caller can confirm the outcome and observe ordering — the first
        element is the product's primary image.
      required:
        - productId
        - images
      properties:
        productId:
          type: string
          format: uuid
          description: Product the images belong to
        images:
          type: array
          description: Full resulting collection of image URLs, in order
          items:
            type: string
            format: uri
            maxLength: 2048

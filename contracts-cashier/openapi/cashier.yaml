openapi: 3.1.0
info:
  title: Hubinity Cashier / Ledger API
  version: 0.1.0
  description: |
    Contract for the Cashier domain. Owns the ledger of revenue and expense
    entries (categorised), and the daily cash session lifecycle. Consumes
    OrderPaid and ServiceRevenueGenerated events.
servers:
  - url: https://api.hubinity.local
tags:
  - name: ledger
paths:
  /api/v1/ledger/entries/{id}:
    get:
      tags: [ledger]
      operationId: getLedgerEntryById
      summary: Fetch a single ledger entry by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entry found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
        '404':
          description: Entry not found
components:
  schemas:
    LedgerEntry:
      type: object
      description: A single revenue or expense record.
      required:
        - id
        - type
        - amount
        - categoryId
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [REVENUE, EXPENSE]
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          default: BRL
        categoryId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
          description: Optional link to the cash session that booked the entry
        sourceEventId:
          type: string
          description: |
            Original event id (e.g. OrderPaid.eventId) for idempotent
            consumption.
        note:
          type: string
        occurredAt:
          type: string
          format: date-time
    LedgerCategory:
      type: object
      description: A categorisation of revenues or expenses.
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [REVENUE, EXPENSE]
        active:
          type: boolean
          default: true
    CashSession:
      type: object
      description: A cashier session (open / close cash drawer).
      required:
        - id
        - status
        - openedAt
        - openingBalance
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, CLOSED]
        operatorId:
          type: string
          format: uuid
        openingBalance:
          type: number
          format: double
          minimum: 0
        closingBalance:
          type: number
          format: double
          minimum: 0
        expectedBalance:
          type: number
          format: double
          minimum: 0
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time

openapi: 3.1.0
info:
  title: Hubinity Order API
  version: 0.1.0
  description: |
    Contract for the Order domain (Sales Channel). Owns orders, line items,
    and payment outcomes. Emits OrderPaid and OrderCancelled events.
servers:
  - url: https://api.hubinity.local
tags:
  - name: orders
paths:
  /api/v1/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrderById
      summary: Fetch an order by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
components:
  schemas:
    Order:
      type: object
      description: A customer order placed through any sales channel.
      required:
        - id
        - status
        - totalAmount
        - items
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          description: Optional, anonymous orders permitted
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED, REFUNDED]
        totalAmount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          description: ISO-4217 currency code
          default: BRL
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        payment:
          $ref: '#/components/schemas/Payment'
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      description: A single line on an order.
      required:
        - productId
        - quantity
        - unitPrice
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: number
          format: double
          minimum: 0
        lineTotal:
          type: number
          format: double
          minimum: 0
    Payment:
      type: object
      description: Payment outcome attached to an order.
      required:
        - method
        - amount
        - status
      properties:
        method:
          type: string
          enum: [CASH, CREDIT_CARD, DEBIT_CARD, PIX, VOUCHER]
        amount:
          type: number
          format: double
          minimum: 0
        status:
          type: string
          enum: [AUTHORIZED, CAPTURED, FAILED, REFUNDED]
        transactionId:
          type: string
          description: External PSP transaction reference, if any
        paidAt:
          type: string
          format: date-time

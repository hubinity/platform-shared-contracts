openapi: 3.1.0
info:
  title: Hubinity Support / Service API
  version: 0.1.0
  description: |
    Contract for the Support / Service Order domain. Owns service tickets
    (ordens de serviço), customers, the catalog of services offered, and
    technicians. Emits ServiceRevenueGenerated when a ticket is closed.
servers:
  - url: https://api.hubinity.local
tags:
  - name: tickets
paths:
  /api/v1/tickets/{id}:
    get:
      tags: [tickets]
      operationId: getTicketById
      summary: Fetch a service ticket by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Ticket not found
components:
  schemas:
    Ticket:
      type: object
      description: A service ticket / ordem de serviço.
      required:
        - id
        - status
        - customerId
        - items
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, AWAITING_PARTS, CLOSED, CANCELLED]
        customerId:
          type: string
          format: uuid
        technicianId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketItem'
        totalAmount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          default: BRL
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
    TicketItem:
      type: object
      description: A service or part attached to a ticket.
      required:
        - serviceId
        - quantity
        - unitPrice
      properties:
        serviceId:
          type: string
          format: uuid
        description:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: number
          format: double
          minimum: 0
    Customer:
      type: object
      description: A person or company served by support.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        document:
          type: string
          description: CPF/CNPJ or other tax ID
        email:
          type: string
          format: email
        phone:
          type: string
    Service:
      type: object
      description: A service offering in the support catalog.
      required:
        - id
        - name
        - basePrice
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        basePrice:
          type: number
          format: double
          minimum: 0
        active:
          type: boolean
          default: true
    Technician:
      type: object
      description: A technician who can be assigned to tickets.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        specialties:
          type: array
          items:
            type: string
        active:
          type: boolean
          default: true

name: Publish (Maven)

# ADR 0010 — deploys the contracts-* reactor to GitHub Packages.
# Trigger: push a tag matching v<parent-pom-version> (e.g. v0.1.0,
# v0.1.0-SNAPSHOT). The tag must exactly match <version> in pom.xml —
# bump the version there first, then tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  publish:
    name: Deploy to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify tag matches pom.xml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match pom.xml version $POM_VERSION. Bump <version> in pom.xml before tagging."
            exit 1
          fi

      - name: Build & verify
        run: mvn -B -ntp verify

      - name: Deploy to GitHub Packages
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: mvn -B -ntp -s settings.xml -DskipTests deploy
